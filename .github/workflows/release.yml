name: Build and publish Cinematic UI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry
        required: true
        type: string

permissions:
  contents: read

# Serialize every catalog publication, including retries and version backfills.
concurrency:
  group: cinematic-catalog-publication
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Check out the verified release source separately from the publication controller
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-candidate
          path: artifacts
      - name: Publish verified release and cumulative stable manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python scripts/publish.py --tag "$RELEASE_TAG"
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Verify public catalog installation and published-version updates
        run: python scripts/integration.py --root release-source --public-manifest 'https://raw.githubusercontent.com/guardipee14/Jellyfin.CinematicUI/repository/manifest.json'
