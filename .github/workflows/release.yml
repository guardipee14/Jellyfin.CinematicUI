name: Build and publish Cinematic UI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: |
          dotnet restore ./Jellyfin.Plugin.CinematicUI.csproj
          dotnet build ./Jellyfin.Plugin.CinematicUI.csproj -c Release --no-restore

      - name: Package plugin and repository manifest
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          SHORT_VERSION="${TAG#v}"
          ASSEMBLY_VERSION="${SHORT_VERSION}.0"
          ZIP_NAME="CinematicUI-${TAG}-jf12.1.zip"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP_NAME}"

          rm -rf release-dist
          mkdir -p release-dist
          cp "bin/Release/net10.0/Jellyfin.Plugin.CinematicUI.dll" release-dist/
          cp meta.json release-dist/
          (cd release-dist && zip -q -r "../${ZIP_NAME}" .)

          CHECKSUM="$(md5sum "${ZIP_NAME}" | awk '{print $1}')"
          TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          cat > manifest.json <<JSON
          [
            {
              "guid": "e4c17f1b-c451-4a31-b98c-5d0ef44f9a21",
              "name": "Cinematic UI",
              "description": "A unified cinematic Jellyfin Web customization with a profile-forward login screen, Plex-inspired theme, and rotating library-driven home hero.",
              "overview": "Cinematic login and home experience for Jellyfin Web",
              "owner": "Donaven Guardipee",
              "category": "General",
              "versions": [
                {
                  "version": "${ASSEMBLY_VERSION}",
                  "changelog": "See the GitHub release notes for ${TAG}.",
                  "targetAbi": "12.1.0.0",
                  "sourceUrl": "${RELEASE_URL}",
                  "checksum": "${CHECKSUM}",
                  "timestamp": "${TIMESTAMP}"
                }
              ]
            }
          ]
          JSON

          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.ZIP_NAME }}
            manifest.json
