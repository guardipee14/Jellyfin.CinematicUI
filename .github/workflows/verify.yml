name: Verify release candidate

on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Validate source and release version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            python scripts/release.py check-source --tag "$REQUESTED_TAG"
            echo "RELEASE_TAG=$REQUESTED_TAG" >> "$GITHUB_ENV"
          else
            VERSION=$(python scripts/release.py check-source)
            echo "RELEASE_TAG=v${VERSION%.0}" >> "$GITHUB_ENV"
          fi
          node --check Web/client.js
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Restore and build
        run: |
          dotnet restore Jellyfin.Plugin.CinematicUI.csproj
          dotnet build Jellyfin.Plugin.CinematicUI.csproj -c Release --no-restore -warnaserror
          dotnet run --project tests/Contracts/Contracts.csproj -c Release -- .
      - name: Test desktop and phone browser behavior
        run: |
          # Preserve retries of immutable releases that predate the browser suite.
          if [ "$RELEASE_TAG" = 'v0.1.5' ] || [ "$RELEASE_TAG" = 'v0.1.6' ]; then
            echo 'Historical release predates browser regression fixtures.'
            exit 0
          fi
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Preserve failed browser test traces
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Package and validate runtime artifacts
        run: python scripts/release.py package --tag "$RELEASE_TAG"
      - name: Test catalog install and normal Update Plugins task
        run: python scripts/integration.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-candidate
          path: |
            artifacts/*.zip
            artifacts/release-entry.json
          if-no-files-found: error
